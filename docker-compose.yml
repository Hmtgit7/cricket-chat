version: '3.8'

services:
  # MongoDB service
  mongo:
    image: mongo:5.0
    container_name: cricket-chat-mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - app-network

  # Backend service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cricket-chat-backend
    restart: always
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://root:password@mongo:27017/cricket-chat?authSource=admin
      - JWT_SECRET=your_jwt_secret
      - JWT_EXPIRY=7d
      - CLIENT_URL=http://localhost
    networks:
      - app-network

  # Frontend service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cricket-chat-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
